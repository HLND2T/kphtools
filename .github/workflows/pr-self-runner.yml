name: PR Self Runner Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository == 'HLND2T/kphtools' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    environment: win64
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    env:
      UV_PYTHON: "3.12"
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      PR_VALIDATION_ARCH: amd64
      PR_VALIDATION_VERSION: "10.0.22621.3668"
      KPHTOOLS_AGENT: ${{ secrets.KPHTOOLS_AGENT }}
      KPHTOOLS_AGENT_MODEL: ${{ secrets.KPHTOOLS_AGENT_MODEL }}
      KPHTOOLS_LLM_APIKEY: ${{ secrets.KPHTOOLS_LLM_APIKEY }}
      KPHTOOLS_LLM_BASEURL: ${{ secrets.KPHTOOLS_LLM_BASEURL }}
      KPHTOOLS_LLM_MODEL: ${{ secrets.KPHTOOLS_LLM_MODEL }}
      KPHTOOLS_LLM_EFFORT: ${{ secrets.KPHTOOLS_LLM_EFFORT }}
      KPHTOOLS_LLM_FAKE_AS: ${{ secrets.KPHTOOLS_LLM_FAKE_AS }}
      KPHTOOLS_LLM_TEMPERATURE: ${{ secrets.KPHTOOLS_LLM_TEMPERATURE }}

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up uv with shared S3 cache
        uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35
        with:
          enable-cache: true
          cache-s3-bucket: actions-cache-kphtools
          cache-local-path: ${{ runner.temp }}/kphtools-uv-cache
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}

      - name: Sync Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv sync --group ci --frozen
          if ($LASTEXITCODE -ne 0) { throw "uv sync failed." }

      - name: Run complete unittest suite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv run --group ci --frozen python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Complete unittest suite failed." }

      - name: Prepare disposable symbol staging
        id: s3_layout
        shell: pwsh
        run: |
          uv run --group ci --frozen python ci_s3_cache.py prepare
          if ($LASTEXITCODE -ne 0) { throw "S3 staging preparation failed." }

      - name: Restore only selected PR binary input shards
        shell: pwsh
        run: |
          uv run --group ci --frozen python ci_symbol_cache.py restore-pr `
            --arch $env:PR_VALIDATION_ARCH --version $env:PR_VALIDATION_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Selected PR input shard restore failed." }

      - name: Validate restored symbol paths
        shell: pwsh
        run: |
          uv run --group ci --frozen python ci_s3_cache.py validate
          if ($LASTEXITCODE -ne 0) { throw "Unsafe restored symbol paths." }

      - name: Download upstream kphdyn.xml
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WORKSPACE

          $inputDirectory = Join-Path $env:CI_PR_ROOT "output"
          $inputXml = Join-Path $inputDirectory "kphdyn.official.xml"
          New-Item -ItemType Directory -Path $inputDirectory -Force | Out-Null

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/winsiderss/systeminformer/refs/heads/master/kphlib/kphdyn.xml" `
            -OutFile $inputXml

          if (-not (Test-Path -LiteralPath $inputXml -PathType Leaf)) {
            throw "Downloaded upstream kphdyn.xml does not exist: $inputXml"
          }
          if ((Get-Item -LiteralPath $inputXml).Length -eq 0) {
            throw "Downloaded upstream kphdyn.xml is empty: $inputXml"
          }
          try {
            [xml](Get-Content -LiteralPath $inputXml -Raw) | Out-Null
          } catch {
            throw "Downloaded upstream kphdyn.xml is not valid XML: $($_.Exception.Message)"
          }

          "PR_INPUT_XML=$inputXml" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize isolated PR inputs without YAML artifacts
        id: pr_inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WORKSPACE
          uv run --group ci --frozen python ci_s3_cache.py isolate `
            --xml $env:PR_INPUT_XML --baseline-xml .github/pr-kernel.xml `
            --arch $env:PR_VALIDATION_ARCH --version $env:PR_VALIDATION_VERSION
          if ($LASTEXITCODE -ne 0) { throw "PR input isolation failed." }

      - name: Download missing selected PE and PDB inputs from MSDL
        shell: pwsh
        env:
          PR_DOWNLOAD_XML: ${{ steps.pr_inputs.outputs.download-xml }}
        run: |
          uv run --group ci --frozen python download_symbols.py "-xml=$env:PR_DOWNLOAD_XML" "-symboldir=$env:KPHTOOLS_SYMBOLDIR"
          if ($LASTEXITCODE -ne 0) { throw "PR input download failed." }

      - name: Verify selected PE and PDB inputs are present without YAML
        shell: pwsh
        run: |
          uv run --group ci --frozen python ci_s3_cache.py verify --arch $env:PR_VALIDATION_ARCH --version $env:PR_VALIDATION_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "PR inputs are unavailable or contain cached YAML. Seed the symbol bucket using https://github.com/HLND2T/kphtools/issues/42 if PE/PDB inputs are missing."
          }

      - name: Analyze symbols and dump YAML artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WORKSPACE

          $symbolsRoot = $env:KPHTOOLS_SYMBOLDIR
          $configYaml = Join-Path $env:WORKSPACE "config.yaml"
          uv run --group ci --frozen python dump_symbols.py `
            "-symboldir=$symbolsRoot" `
            "-configyaml=$configYaml" `
            "-arch=$env:PR_VALIDATION_ARCH" `
            "-version=$env:PR_VALIDATION_VERSION" `
            -debug
          if ($LASTEXITCODE -ne 0) {
            throw "Symbol analysis failed for $env:PR_VALIDATION_ARCH/$env:PR_VALIDATION_VERSION."
          }

          $generatedYaml = @(Get-ChildItem -LiteralPath $symbolsRoot -Recurse -File -Filter "*.yaml")
          if ($generatedYaml.Count -eq 0) {
            throw "Symbol analysis completed without generating YAML artifacts."
          }
          "PR_GENERATED_YAML_COUNT=$($generatedYaml.Count)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Update candidate kphdyn.xml from YAML artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WORKSPACE

          $symbolsRoot = $env:KPHTOOLS_SYMBOLDIR
          $configYaml = Join-Path $env:WORKSPACE "config.yaml"
          $candidateXml = Join-Path $env:CI_PR_ROOT "output\kphdyn.candidate.xml"

          uv run --group ci --frozen python update_symbols.py `
            "-xml=$env:PR_INPUT_XML" `
            "-symboldir=$symbolsRoot" `
            "-configyaml=$configYaml" `
            "-outxml=$candidateXml"
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate kphdyn.xml generation failed."
          }
          if (-not (Test-Path -LiteralPath $candidateXml -PathType Leaf)) {
            throw "Candidate kphdyn.xml was not generated: $candidateXml"
          }
          if ((Get-Item -LiteralPath $candidateXml).Length -eq 0) {
            throw "Candidate kphdyn.xml is empty: $candidateXml"
          }
          try {
            [xml](Get-Content -LiteralPath $candidateXml -Raw) | Out-Null
          } catch {
            throw "Candidate kphdyn.xml is not valid XML: $($_.Exception.Message)"
          }

          "PR_CANDIDATE_XML=$candidateXml" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write validation summary
        if: always()
        shell: pwsh
        run: |
          "## PR self-runner validation" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Result: ${{ job.status }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Workspace: ``$env:WORKSPACE``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- Version: ``$env:PR_VALIDATION_ARCH/$env:PR_VALIDATION_VERSION``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (-not [string]::IsNullOrWhiteSpace($env:PR_GENERATED_YAML_COUNT)) {
            "- Generated YAML artifacts: $env:PR_GENERATED_YAML_COUNT" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PR_CANDIDATE_XML)) {
            "- Candidate XML: ``$env:PR_CANDIDATE_XML``" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload PR validation diagnostics
        if: always() && steps.s3_layout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-pr-analysis/output
            .ci-pr-analysis/symbols/**/*.log
            .ci-pr-analysis/symbols/**/*.yaml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Clean disposable PR data on this runner
        if: always() && steps.s3_layout.outcome == 'success'
        shell: pwsh
        run: |
          uv run --group ci --frozen python ci_s3_cache.py cleanup
          if ($LASTEXITCODE -ne 0) { throw "PR staging cleanup failed." }
