[project]
name = "kphtools"
version = "0.1.0"
description = "Toolkits for KPH dynamic data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alibabacloud-oss-v2",
    "anthropic",
    "asn1crypto>=1.5.1,<2",
    "cryptography>=47,<48",
    "httpx",
    "lief>=0.17.6,<0.18",
    "mcp",
    "openai",
    "pefile",
    "python-dotenv",
    "pyyaml",
    "requests",
    "watchdog>=6.0.0",
]

[tool.uv]
package = false

[dependency-groups]
ci = [
    "boto3>=1.43.110",
    "zstandard>=0.25.0",
]
